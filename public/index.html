<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>휴비즈 ICT R&D 과제 진행 총괄표</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <p class="badge">from 2016</p>
        <h1>휴비즈 ICT 기업부설연구소 R&amp;D 과제 진행 총괄표</h1>
        <p class="sub">스프레드시트 느낌은 유지하고, 웹에서는 더 읽기 쉽게 정리했습니다.</p>
      </section>

      <section class="stats" id="stats"></section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순서</th>
              <th>사업명</th>
              <th>과제명(목표)</th>
              <th>주관청</th>
              <th>연구기관</th>
              <th>자사기술분야</th>
              <th>연구기간</th>
              <th>연구책임자</th>
              <th>연구비총액(만원)</th>
              <th>자사연구과제비(만원)</th>
              <th>현금(만원)</th>
              <th>현물(만원)</th>
              <th>성공여부</th>
            </tr>
          </thead>
          <tbody id="project-body"></tbody>
        </table>
      </section>
    </main>

    <template id="row-template">
      <tr>
        <td data-key="order_no"></td>
        <td data-key="business_name"></td>
        <td data-key="project_title"></td>
        <td data-key="supervising_agency"></td>
        <td data-key="research_org"></td>
        <td data-key="own_tech_field"></td>
        <td data-key="research_period"></td>
        <td data-key="researcher"></td>
        <td data-key="total_budget_manwon"></td>
        <td data-key="own_task_budget_manwon"></td>
        <td data-key="cash_budget_manwon"></td>
        <td data-key="in_kind_budget_manwon"></td>
        <td data-key="success_status"></td>
      </tr>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
